<aside class="sidebar">
  <!-- Action -->
  <button class="new-btn" (click)="createFolder.emit()">
    ➕ Nytt
  </button>

  <!-- Search Button -->
  <button class="new-btn" (click)="viewChange.emit('search')" 
    [class.active]="currentView === 'search'">
    🔍 Sök
  </button>

  <!-- Navigation -->
  <nav class="nav">
    <button class="nav-item" (click)="viewChange.emit('home')"
      [class.active]="currentView === 'home'">
      Startsida
    </button>

    <button class="nav-item" (click)="viewChange.emit('my-drive')"
      [class.active]="currentView === 'my-drive'">
      Min enhet
    </button>

    <button class="nav-item">
      Datorer
    </button>

    <button class="nav-item">
      Delade med mig
    </button>

    <button class="nav-item">
      Senaste
    </button>

    <button class="nav-item">
      Stjärnmärkta
    </button>

    <button class="nav-item">
      Skräppost
    </button>

    <button class="nav-item" (click)="viewChange.emit('trash')"
      [class.active]="currentView === 'trash'">
      Papperskorg
    </button>

    <button class="nav-item">
      Lagring
    </button>
  </nav>
  <button class="new-btn">
    Få mer lagring
  </button>
    
</aside>
